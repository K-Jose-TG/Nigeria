<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria Command - Political Simulator</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body style="margin: 0; padding: 0; background-color: #0B2F20; color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif;">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        const Icon = ({ path, size = 15, color = "#C89B3C" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {path}
            </svg>
        );

        const Coins = (props) => <Icon {...props} path={<><circle cx="8" cy="8" r="6"/><path d="M18 8a6 6 0 0 1-6 6 6 6 0 0 1-6-6"/><path d="M2 12a6 6 0 0 0 6 6 6 6 0 0 0 6-6"/></>} />;
        const Landmark = (props) => <Icon {...props} path={<><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/></>} />;
        const TrendingDown = (props) => <Icon {...props} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>} />;
        const TrendingUp = (props) => <Icon {...props} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />;
        const Flag = (props) => <Icon {...props} path={<><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></>} />;
        const Users = (props) => <Icon {...props} path={<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />;
        const Shield = (props) => <Icon {...props} path={<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>} />;
        const Volume2 = (props) => <Icon {...props} path={<><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></>} />;
        const VolumeX = (props) => <Icon {...props} path={<><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></>} />;
        const Loader2 = (props) => <Icon {...props} path={<line x1="12" y1="2" x2="12" y2="6"/>} />;
        const Send = (props) => <Icon {...props} path={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} />;

        const styles = {
          page: { maxWidth: "800px", margin: "0 auto", padding: "20px", boxSizing: "border-box" },
          header: { borderBottom: "2px solid #C89B3C", paddingBottom: "15px", marginBottom: "20px" },
          headerTop: { display: "flex", alignItems: "center", gap: "15px" },
          seal: { width: "45px", height: "45px", borderRadius: "50%", backgroundColor: "#C89B3C", color: "#0B2F20", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: "bold", fontSize: "18px" },
          kicker: { fontSize: "10px", color: "#C89B3C", letterSpacing: "1px" },
          h1: { margin: 0, fontSize: "24px", color: "#FFFFFF" },
          musicBtn: { background: "transparent", border: "1px solid #C89B3C", padding: "8px", borderRadius: "6px", cursor: "pointer" },
          termBar: { marginTop: "15px" },
          termBarLabel: { fontSize: "12px", color: "#9FBFA9", marginBottom: "5px" },
          termTrack: { height: "6px", backgroundColor: "#154430", borderRadius: "3px", overflow: "hidden" },
          termFill: { height: "100%", backgroundColor: "#C89B3C", transition: "width 0.3s ease" },
          briefingCard: { backgroundColor: "#133E2B", padding: "25px", borderRadius: "8px", border: "1px solid #C89B3C" },
          briefingEyebrow: { color: "#C89B3C", fontSize: "12px", fontWeight: "bold", marginBottom: "10px" },
          briefingText: { color: "#E0E0E0", lineHeight: "1.6", marginBottom: "15px" },
          briefingText2: { color: "#A0A0A0", lineHeight: "1.5", fontSize: "14px", marginBottom: "20px" },
          startBtn: { backgroundColor: "#C89B3C", color: "#0B2F20", border: "none", padding: "12px 24px", fontWeight: "bold", borderRadius: "4px", cursor: "pointer", width: "100%", fontSize: "16px" },
          statGrid: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: "10px", marginBottom: "20px" },
          statCard: { backgroundColor: "#133E2B", padding: "12px", borderRadius: "6px", border: "1px solid #1E543B" },
          statLabel: { fontSize: "11px", color: "#9FBFA9", marginTop: "4px" },
          statValue: { fontSize: "16px", fontWeight: "bold", color: "#FFFFFF", marginTop: "2px" },
          memoCard: { backgroundColor: "#133E2B", padding: "20px", borderRadius: "8px", border: "1px solid #C89B3C" },
          memoHeader: { display: "flex", justifyContent: "space-between", marginBottom: "10px" },
          tag: { backgroundColor: "#C89B3C", color: "#0B2F20", fontSize: "10px", fontWeight: "bold", padding: "2px 6px", borderRadius: "3px" },
          memoDate: { fontSize: "12px", color: "#9FBFA9" },
          memoTitle: { fontSize: "18px", fontWeight: "bold", marginBottom: "10px" },
          memoBrief: { color: "#D0D0D0", lineHeight: "1.5", marginBottom: "20px" },
          optWrap: { display: "flex", flexDirection: "column", gap: "10px" },
          optBtn: { backgroundColor: "#1A4D36", border: "1px solid #2B6B4E", padding: "12px", borderRadius: "6px", textAlign: "left", cursor: "pointer", color: "#FFFFFF" },
          optLabel: { fontWeight: "bold", fontSize: "14px", color: "#C89B3C", marginBottom: "4px" },
          optBlurb: { fontSize: "12px", color: "#A0A0A0" },
          customBox: { marginTop: "15px", paddingTop: "15px", borderTop: "1px solid #1E543B" },
          customLabel: { fontSize: "11px", color: "#C89B3C", fontWeight: "bold", marginBottom: "8px" },
          customRow: { display: "flex", gap: "8px" },
          customInput: { flex: 1, backgroundColor: "#0B2F20", border: "1px solid #2B6B4E", padding: "10px", borderRadius: "4px", color: "#FFFFFF" },
          customSubmit: { backgroundColor: "#C89B3C", border: "none", padding: "0 15px", borderRadius: "4px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" },
          loadingCard: { backgroundColor: "#133E2B", padding: "40px", borderRadius: "8px", textAlign: "center" },
          loadingText: { color: "#9FBFA9", marginTop: "10px" }
        };

        const START = {
          turn: 1, year: 2027, quarter: "Q1", treasury: 4200, reserves: 34, nairaRate: 1550,
          gdpGrowth: 2.9, inflation: 24.5, unemployment: 33, approval: 58, security: 61,
          corruption: 47, debt: 87, log: [], ended: false, endReason: ""
        };

        const STAT_META = [
          { key: "treasury", label: "Treasury Buffer", icon: Coins, fmt: v => `₦${Math.round(v).toLocaleString()}B` },
          { key: "reserves", label: "FX Reserves", icon: Landmark, fmt: v => `$${v.toFixed(1)}B` },
          { key: "nairaRate", label: "₦/$ Rate", icon: TrendingDown, fmt: v => `₦${Math.round(v)}` },
          { key: "gdpGrowth", label: "GDP Growth", icon: TrendingUp, fmt: v => `${v.toFixed(1)}%` },
          { key: "inflation", label: "Inflation", icon: Flag, fmt: v => `${v.toFixed(1)}%` },
          { key: "unemployment", label: "Unemployment", icon: Users, fmt: v => `${v.toFixed(1)}%` },
          { key: "approval", label: "Approval", icon: Users, fmt: v => `${Math.round(v)}%` },
          { key: "security", label: "Security Index", icon: Shield, fmt: v => `${Math.round(v)}` }
        ];

        const FALLBACK_EVENTS = [
          {
            tag: "ECONOMY", title: "Fuel Subsidy Pressure",
            brief: "NNPC reports the subsidy shortfall is draining the treasury, while the IMF withholds the next credit tranche until further cuts are made.",
            options: [
              { label: "Fully remove subsidy", blurb: "Markets and the IMF cheer. The streets don't.", effects: { treasury: 350, approval: -14, inflation: 4, security: -6 } },
              { label: "Phase it out over the year", blurb: "Slower pain, slower relief.", effects: { treasury: 140, approval: -5, inflation: 1.5 } },
              { label: "Keep it, borrow to cover", blurb: "Buys peace, not sustainability.", effects: { treasury: -300, approval: 6, debt: 5 } }
            ]
          }
        ];

        async function callAI(prompt, maxTokens) {
          const response = await fetch("/.netlify/functions/ai-proxy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt, max_tokens: maxTokens })
          });
          if (!response.ok) throw new Error("AI request failed");
          const data = await response.json();
          return data.text.replace(/```json|```/g, "").trim();
        }

        function NigeriaCommand() {
          const [state, setState] = useState(START);
          const [current, setCurrent] = useState(FALLBACK_EVENTS[0]);
          const [loading, setLoading] = useState(false);
          const [started, setStarted] = useState(false);
          const [customText, setCustomText] = useState("");
          const [customLoading, setCustomLoading] = useState(false);
          const [musicOn, setMusicOn] = useState(false);

          function choose(option) {
            const next = { ...state, turn: state.turn + 1, approval: Math.max(0, state.approval - 2) };
            if (next.turn > 16) {
              next.ended = true;
              next.endReason = "Your 4-year presidency term has concluded.";
            }
            setState(next);
          }

          async function submitCustomDirective() {
            if (!customText.trim()) return;
            setCustomLoading(true);
            try {
              choose({ label: customText, blurb: "Executing presidential order..." });
              setCustomText("");
            } finally {
              setCustomLoading(false);
            }
          }

          return (
            <div style={styles.page}>
              <div style={styles.header}>
                <div style={styles.headerTop}>
                  <div style={styles.seal}>NG</div>
                  <div style={{ flex: 1 }}>
                    <div style={styles.kicker}>OFFICE OF THE PRESIDENT · FEDERAL REPUBLIC OF NIGERIA</div>
                    <h1 style={styles.h1}>Nigeria Command</h1>
                  </div>
                  <button onClick={() => setMusicOn(!musicOn)} style={styles.musicBtn}>
                    {musicOn ? <Volume2 size={16} color="#C89B3C" /> : <VolumeX size={16} color="#9FBFA9" />}
                  </button>
                </div>
              </div>

              {!started ? (
                <div style={styles.briefingCard}>
                  <div style={styles.briefingEyebrow}>CLASSIFIED · INAUGURATION BRIEFING</div>
                  <p style={styles.briefingText}>
                    You have been sworn in as President of Nigeria. Sixteen quarters stand between you and re-election.
                  </p>
                  <button style={styles.startBtn} onClick={() => setStarted(true)}>Take the Oath of Office</button>
                </div>
              ) : (
                <>
                  <div style={styles.statGrid}>
                    {STAT_META.map(m => {
                      const IconComp = m.icon;
                      return (
                        <div key={m.key} style={styles.statCard}>
                          <IconComp size={15} color="#C89B3C" />
                          <div style={styles.statLabel}>{m.label}</div>
                          <div style={styles.statValue}>{m.fmt(state[m.key])}</div>
                        </div>
                      );
                    })}
                  </div>

                  {!state.ended ? (
                    <div style={styles.memoCard}>
                      <div style={styles.memoHeader}>
                        <span style={styles.tag}>{current.tag}</span>
                        <span style={styles.memoDate}>{state.quarter} {state.year}</span>
                      </div>
                      <div style={styles.memoTitle}>{current.title}</div>
                      <p style={styles.memoBrief}>{current.brief}</p>
                      <div style={styles.optWrap}>
                        {current.options.map((opt, i) => (
                          <button key={i} style={styles.optBtn} onClick={() => choose(opt)}>
                            <div style={styles.optLabel}>{opt.label}</div>
                            <div style={styles.optBlurb}>{opt.blurb}</div>
                          </button>
                        ))}
                        <div style={styles.customBox}>
                          <div style={styles.customLabel}>OR ISSUE YOUR OWN DIRECTIVE</div>
                          <div style={styles.customRow}>
                            <input
                              style={styles.customInput}
                              type="text"
                              placeholder="Type custom action..."
                              value={customText}
                              onChange={e => setCustomText(e.target.value)}
                              onKeyDown={e => { if (e.key === "Enter") submitCustomDirective(); }}
                            />
                            <button style={styles.customSubmit} onClick={submitCustomDirective}>
                              <Send size={15} color="#0B2F20" />
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div style={styles.briefingCard}>
                      <h2>Presidency Term Ended</h2>
                      <p>{state.endReason}</p>
                      <button style={styles.startBtn} onClick={() => { setState(START); setStarted(false); }}>Restart Simulation</button>
                    </div>
                  )}
                </>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<NigeriaCommand />);
    </script>
</body>
</html>
