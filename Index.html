<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria Command - Political Simulator</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; padding: 0; background-color: #0B2F20; color: #E0EADE; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        const Icon = ({ path, size = 15, color = "#C89B3C" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {path}
            </svg>
        );

        const Coins = (props) => <Icon {...props} path={<><circle cx="8" cy="8" r="6"/><path d="M18 8a6 6 0 0 1-6 6 6 6 0 0 1-6-6"/><path d="M2 12a6 6 0 0 0 6 6 6 6 0 0 0 6-6"/></>} />;
        const Landmark = (props) => <Icon {...props} path={<><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7 12 2"/></>} />;
        const TrendingDown = (props) => <Icon {...props} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>} />;
        const TrendingUp = (props) => <Icon {...props} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />;
        const Flag = (props) => <Icon {...props} path={<><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></>} />;
        const Users = (props) => <Icon {...props} path={<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1 0 7.75"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />;
        const Shield = (props) => <Icon {...props} path={<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>} />;
        const Volume2 = (props) => <Icon {...props} path={<><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></>} />;
        const VolumeX = (props) => <Icon {...props} path={<><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></>} />;
        const Loader2 = (props) => <Icon {...props} path={<line x1="12" y1="2" x2="12" y2="6"/>} />;
        const Send = (props) => <Icon {...props} path={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} />;

        const styles = {
            page: { maxWidth: "800px", margin: "0 auto", padding: "20px", boxSizing: "border-box" },
            header: { borderBottom: "1px solid #1D4A34", paddingBottom: "15px", marginBottom: "20px" },
            headerTop: { display: "flex", alignItems: "center", gap: "15px" },
            seal: { width: "40px", height: "40px", borderRadius: "50%", background: "#C89B3C", color: "#0B2F20", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: "bold" },
            kicker: { fontSize: "10px", color: "#C89B3C", letterSpacing: "1px" },
            h1: { margin: 0, fontSize: "24px", color: "#FFF" },
            musicBtn: { background: "none", border: "1px solid #1D4A34", borderRadius: "4px", padding: "8px", cursor: "pointer" },
            termBar: { marginTop: "15px" },
            termBarLabel: { fontSize: "12px", color: "#9FBFA9", marginBottom: "5px" },
            termTrack: { height: "6px", background: "#1D4A34", borderRadius: "3px", overflow: "hidden" },
            termFill: { height: "100%", background: "#C89B3C", transition: "width 0.3s" },
            briefingCard: { background: "#113A28", border: "1px solid #1D4A34", borderRadius: "8px", padding: "24px", marginBottom: "20px" },
            briefingEyebrow: { color: "#C89B3C", fontSize: "12px", fontWeight: "bold", marginBottom: "10px" },
            briefingText: { fontSize: "15px", lineHeight: "1.6", color: "#E0EADE" },
            briefingText2: { fontSize: "14px", lineHeight: "1.5", color: "#9FBFA9" },
            startBtn: { background: "#C89B3C", color: "#0B2F20", border: "none", padding: "12px 24px", borderRadius: "4px", fontWeight: "bold", cursor: "pointer", width: "100%", marginTop: "15px", fontSize: "16px" },
            statGrid: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: "10px", marginBottom: "20px" },
            statCard: { background: "#113A28", border: "1px solid #1D4A34", padding: "12px", borderRadius: "6px" },
            statLabel: { fontSize: "11px", color: "#9FBFA9", marginTop: "4px" },
            statValue: { fontSize: "16px", fontWeight: "bold", color: "#FFF", marginTop: "2px" },
            loadingCard: { background: "#113A28", padding: "40px", textAlign: "center", borderRadius: "8px" },
            loadingText: { color: "#9FBFA9", marginTop: "10px", fontSize: "14px" },
            memoCard: { background: "#113A28", border: "1px solid #1D4A34", borderRadius: "8px", padding: "20px" },
            memoHeader: { display: "flex", justifyContent: "space-between", marginBottom: "10px" },
            tag: { background: "#C89B3C22", color: "#C89B3C", fontSize: "10px", padding: "2px 8px", borderRadius: "4px", fontWeight: "bold" },
            memoDate: { fontSize: "12px", color: "#9FBFA9" },
            memoTitle: { fontSize: "18px", fontWeight: "bold", color: "#FFF", marginBottom: "10px" },
            memoBrief: { fontSize: "14px", lineHeight: "1.5", color: "#E0EADE", marginBottom: "20px" },
            optWrap: { display: "flex", flexDirection: "column", gap: "10px" },
            optBtn: { background: "#0B2F20", border: "1px solid #1D4A34", padding: "12px", borderRadius: "6px", textAlign: "left", cursor: "pointer", color: "#FFF" },
            optLabel: { fontWeight: "bold", fontSize: "14px", color: "#C89B3C" },
            optBlurb: { fontSize: "12px", color: "#9FBFA9", marginTop: "4px" },
            customBox: { marginTop: "15px", borderTop: "1px solid #1D4A34", paddingTop: "15px" },
            customLabel: { fontSize: "10px", color: "#C89B3C", fontWeight: "bold", marginBottom: "8px" },
            customRow: { display: "flex", gap: "10px" },
            customInput: { flex: 1, background: "#0B2F20", border: "1px solid #1D4A34", padding: "10px", borderRadius: "4px", color: "#FFF" },
            customSubmit: { background: "#C89B3C", border: "none", padding: "0 15px", borderRadius: "4px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }
        };

        const START = {
            turn: 1, year: 2027, quarter: "Q1", treasury: 4200, reserves: 34, nairaRate: 1550, gdpGrowth: 2.9, inflation: 24.5, unemployment: 33, approval: 58, security: 61, corruption: 47, debt: 87, log: [], ended: false, endReason: "",
        };

        const STAT_META = [
            { key: "treasury", label: "Treasury Buffer", icon: Coins, fmt: v => `₦${Math.round(v).toLocaleString()}B` },
            { key: "reserves", label: "FX Reserves", icon: Landmark, fmt: v => `$${v.toFixed(1)}B` },
            { key: "nairaRate", label: "₦/$ Rate", icon: TrendingDown, fmt: v => `₦${Math.round(v)}` },
            { key: "gdpGrowth", label: "GDP Growth", icon: TrendingUp, fmt: v => `${v.toFixed(1)}%` },
            { key: "inflation", label: "Inflation", icon: Flag, fmt: v => `${v.toFixed(1)}%` },
            { key: "unemployment", label: "Unemployment", icon: Users, fmt: v => `${v.toFixed(1)}%` },
            { key: "approval", label: "Approval", icon: Users, fmt: v => `${Math.round(v)}%` },
            { key: "security", label: "Security Index", icon: Shield, fmt: v => `${Math.round(v)}` },
        ];

        const EFFECT_KEYS = ["treasury", "reserves", "nairaRate", "gdpGrowth", "inflation", "unemployment", "approval", "security", "debt", "corruption"];
        const CLAMP_RANGE = { treasury: 450, reserves: 8, nairaRate: 300, gdpGrowth: 1.2, inflation: 5, unemployment: 2.5, approval: 16, security: 11, debt: 8, corruption: 11 };

        const FALLBACK_EVENTS = [
            {
                tag: "ECONOMY", title: "Fuel Subsidy Pressure",
                brief: "NNPC reports the subsidy shortfall is draining the treasury, while the IMF withholds the next credit tranche until further cuts are made.",
                options: [
                    { label: "Fully remove subsidy", blurb: "Markets and the IMF cheer. The streets don't.", effects: { treasury: 350, approval: -14, inflation: 4, security: -6 } },
                    { label: "Phase it out over the year", blurb: "Slower pain, slower relief.", effects: { treasury: 140, approval: -5, inflation: 1.5 } },
                    { label: "Keep it, borrow to cover", blurb: "Buys peace, not sustainability.", effects: { treasury: -300, approval: 6, debt: 5 } },
                ],
            },
            {
                tag: "TRADE WAR", title: "Washington Announces New Tariffs",
                brief: "The US slaps a 15% tariff on Nigerian crude and LNG exports as part of a broader reciprocal-trade realignment.",
                options: [
                    { label: "Retaliate with tariffs on US goods", blurb: "Wheat, machinery, and pharma get pricier at home.", effects: { gdpGrowth: -0.6, approval: 4, inflation: 1.5, reserves: -2 } },
                    { label: "Negotiate a carve-out deal", blurb: "Diplomacy over confrontation; takes time.", effects: { gdpGrowth: -0.2, approval: -2 } },
                    { label: "Pivot exports toward China & India", blurb: "Reroute crude eastward at a discount.", effects: { gdpGrowth: -0.3, reserves: -3, approval: -1 } },
                ],
            },
            {
                tag: "SECURITY", title: "Banditry Surge in the Northwest",
                brief: "Armed groups in Zamfara and Kaduna escalate kidnappings-for-ransom, hitting rural communities and highways.",
                options: [
                    { label: "Launch a major military offensive", blurb: "Costly and risky, but visible resolve.", effects: { treasury: -260, security: 10, approval: 3 } },
                    { label: "Negotiate local ceasefires", blurb: "Quiet but fragile, criticized as rewarding crime.", effects: { security: 3, approval: -4, treasury: -40 } },
                ],
            },
        ];

        function clampVal(key, v) {
            if (["approval", "security", "unemployment", "corruption"].includes(key)) return Math.max(0, Math.min(100, v));
            if (key === "reserves") return Math.max(2, v);
            if (key === "inflation") return Math.max(0, v);
            return v;
        }

        function applyEffects(state, effects) {
            const next = { ...state };
            for (const [k, raw] of Object.entries(effects || {})) {
                if (!EFFECT_KEYS.includes(k)) continue;
                const cap = CLAMP_RANGE[k] ?? 999;
                const delta = Math.max(-cap, Math.min(cap, Number(raw) || 0));
                next[k] = clampVal(k, (next[k] ?? 0) + delta);
            }
            return next;
        }

        function endingCheck(state) {
            if (state.approval <= 8) return "Your government collapses under a vote of no confidence and mass protest. Approval hit rock bottom.";
            if (state.reserves <= 2.5) return "Foreign reserves are exhausted. The naira collapses and the IMF takes emergency control of fiscal policy.";
            if (state.security <= 8) return "Security has broken down nationally. A state of emergency is declared and the military assumes temporary control.";
            if (state.treasury <= -600) return "The treasury is insolvent. Nigeria defaults on domestic obligations, triggering a constitutional crisis.";
            return null;
        }

        function quarterLabel(turn) {
            const quarters = ["Q1", "Q2", "Q3", "Q4"];
            return { year: 2027 + Math.floor((turn - 1) / 4), quarter: quarters[(turn - 1) % 4] };
        }

        function pickFallback(usedTitles) {
            const pool = FALLBACK_EVENTS.filter(e => !usedTitles.includes(e.title));
            const source = pool.length ? pool : FALLBACK_EVENTS;
            return source[Math.floor(Math.random() * source.length)];
        }

        function NigeriaCommand() {
            const [state, setState] = useState(START);
            const [current, setCurrent] = useState(null);
            const [loading, setLoading] = useState(false);
            const [started, setStarted] = useState(false);
            const [musicOn, setMusicOn] = useState(false);

            const [customText, setCustomText] = useState("");
            const [customLoading, setCustomLoading] = useState(false);

            const historyRef = useRef([]);

            async function loadNextEvent(nextState) {
                setLoading(true);
                setCustomText("");

                // PASTE YOUR OPENROUTER KEY BELOW
                const OPENROUTER_API_KEY = "YOUR_OPENROUTER_API_KEY_HERE";

                try {
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "openai/gpt-4o-mini",
                            response_format: { type: "json_object" },
                            messages: [
                                {
                                    role: "system",
                                    content: `You are the event generator for a Nigerian presidential simulator game set in 2027.
Generate realistic political, economic, security, or social crises.
You MUST respond strictly in valid JSON using this format:
{
  "tag": "ECONOMY",
  "title": "Event Title",
  "brief": "A 2-3 sentence scenario briefing.",
  "options": [
    {
      "label": "Option 1 Title",
      "blurb": "Short summary of effect",
      "effects": { "treasury": -50, "approval": 3 }
    },
    {
      "label": "Option 2 Title",
      "blurb": "Alternative summary",
      "effects": { "security": 5, "approval": -4 }
    }
  ]
}`
                                },
                                {
                                    role: "user",
                                    content: `Current game state: Date: ${nextState.year} ${nextState.quarter}, Treasury: ₦${nextState.treasury}B, Approval: ${nextState.approval}%, Security: ${nextState.security}%, Inflation: ${nextState.inflation}%. Generate the next presidential briefing.`
                                }
                            ]
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

                    const data = await response.json();
                    const aiEvent = JSON.parse(data.choices[0].message.content);
                    setCurrent(aiEvent);

                } catch (err) {
                    console.error("OpenRouter call failed, utilizing local pool:", err);
                    setCurrent(pickFallback(historyRef.current.map(h => h.title)));
                } finally {
                    setLoading(false);
                }
            }

            function startGame() {
                setState(START);
                historyRef.current = [];
                setCustomText("");
                setStarted(true);
                loadNextEvent(START);
            }

            function choose(option) {
                let next = applyEffects(state, option.effects);
                
                const logEntry = `${state.quarter} ${state.year} — ${current.title}: chose "${option.label}"`;
                historyRef.current = [{ title: current.title, choice: option.label }, ...historyRef.current].slice(0, 12);
                next.log = [logEntry, ...next.log].slice(0, 40);

                const { year, quarter } = quarterLabel(next.turn + 1);
                next.turn += 1;
                next.year = year;
                next.quarter = quarter;

                const ending = endingCheck(next);
                if (ending) {
                    next.ended = true;
                    next.endReason = ending;
                    setState(next);
                    return;
                }

                setState(next);
                loadNextEvent(next);
            }

            function submitCustomDirective() {
                const directive = customText.trim();
                if (!directive || customLoading || loading) return;
                setCustomLoading(true);
                setTimeout(() => {
                    choose({
                        label: directive,
                        blurb: "Presidential order executed.",
                        effects: { approval: 1, treasury: -50 }
                    });
                    setCustomLoading(false);
                }, 400);
            }

            const termProgress = Math.min(100, Math.round(((state.turn - 1) / 16) * 100));

            return (
                <div style={styles.page}>
                    <div style={styles.header}>
                        <div style={styles.headerTop}>
                            <div style={styles.seal}>NG</div>
                            <div style={{ flex: 1 }}>
                                <div style={styles.kicker}>OFFICE OF THE PRESIDENT · FEDERAL REPUBLIC OF NIGERIA</div>
                                <div style={styles.h1}>Nigeria Command</div>
                            </div>
                            <button onClick={() => setMusicOn(!musicOn)} style={styles.musicBtn}>
                                {musicOn ? <Volume2 size={16} color="#C89B3C" /> : <VolumeX size={16} color="#9FBFA9" />}
                            </button>
                        </div>
                        {started && !state.ended && (
                            <div style={styles.termBar}>
                                <div style={styles.termBarLabel}>Term Progress — {state.quarter} {state.year} · presidential briefing engine</div>
                                <div style={styles.termTrack}><div style={{ ...styles.termFill, width: `${termProgress}%` }} /></div>
                            </div>
                        )}
                    </div>

                    {!started ? (
                        <div style={styles.briefingCard}>
                            <div style={styles.briefingEyebrow}>CLASSIFIED · INAUGURATION BRIEFING</div>
                            <p style={styles.briefingText}>
                                You have just been sworn in as President of Nigeria, 2027. Oil revenue is volatile
