”;

  treasury: 4200,
  reserves: 34,
  nairaRate: 1550,
  gdpGrowth: 2.9,
  inflation: 24.5,
  unemployment: 33,
  approval: 58,
  security: 61,
  corrupt
  debt: 87,
  log: [],
  ended: false,
  endReason: "",
};

const STAT_META = [
  { key: "treasury", label: "Treasury Buffer", fmt: v => `₦${Math.round(v).toLocaleString()}B` },
  { key: "reserves", label: "FX Reserves", fmt: v => `$${v.toFixed(1)}B` },
  { key: "nairaRate", label: "₦/$ Rate", fmt: v => `₦${Math.round(v)}` },

const EFFECT_KEYS = ["treasury", "reserves", "nairaRate", "gdpGrowth", "inflation", "unemployment", "approval", "security", "debt", "corruption"];
const CLAMP_RANGE = { treasury: 450, reserves: 8, nairaRate: 300, gdpGrowth: 1.2, inflation: 5, unemployment: 2.5, approval: 16, security: 11, debt: 8, corruption: 11 };

// Small local fallback pool, only used if the live generator fails (offline / rate limit)
const FALLBACK_EVENTS = [
  {
    tag: "ECONOMY", title: "Fuel Subsidy Pressure",
    brief: "NNPC reports the subsidy shortfall is draining the treasury, while the IMF withholds the next credit tranche until further cuts are made.",
    options: [
      { label: "Fully remove subsidy", blurb: "Markets and the IMF cheer. The streets don't.", effects: { treasury: 350, approval: -14, inflation: 4, security: -6 } },
      { label: "Phase it out over the year", blurb: "Slower pain, slower relief.", effects: { treasury: 140, approval: -5, inflation: 1.5 } },
      { label: "Keep it, borrow to cover", blurb: "Buys peace, not sustainability.", effects: { treasury: -300, approval: 6, debt: 5 } },
    ],
  },
  {
    tag: "TRADE WAR", title: "Washington Announces New Tariffs",
    brief: "The US slaps a 15% tariff on Nigerian crude and LNG exports as part of a broader reciprocal-trade realignment.",
    options: [
      { label: "Retaliate with tariffs on US goods", blurb: "Wheat, machinery, and pharma get pricier at home.", effects: { gdpGrowth: -0.6, approval: 4, inflation: 1.5, reserves: -2 } },
      { label: "Negotiate a carve-out deal", blurb: "Diplomacy over confrontation; takes time.", effects: { gdpGrowth: -0.2, approval: -2 } },
      { label: "Pivot exports toward China & India", blurb: "Reroute crude eastward at a discount.", effects: { gdpGrowth: -0.3, reserves: -3, approval: -1 } },
    ],
  },
  {
    tag: "SECURITY", title: "Banditry Surge in the Northwest",
    brief: "Armed groups in Zamfara and Kaduna escalate kidnappings-for-ransom, hitting rural communities and highways.",
    options: [
      { label: "Launch a major military offensive", blurb: "Costly and risky, but visible resolve.", effects: { treasury: -260, security: 10, approval: 3 } },
      { label: "Negotiate local ceasefires", blurb: "Quiet but fragile, criticized as rewarding crime.", effects: { security: 3, approval: -4, treasury: -40 } },
    ],
  },
];

function clampVal(key, v) {
  if (["approval", "security", "unemployment", "corruption"].includes(key)) return Math.max(0, Math.min(100, v));
  if (key === "reserves") return Math.max(2, v);
  if (key === "inflation") return Math.max(0, v);
  return v;
}

function applyEffects(state, effects) {
  const next = { ...state };
  for (const [k, raw] of Object.entries(effects || {})) {
    if (!EFFECT_KEYS.includes(k)) continue;
    const cap = CLAMP_RANGE[k] ?? 999;
    const delta = Math.max(-cap, Math.min(cap, Number(raw) || 0));
    next[k] = clampVal(k, (next[k] ?? 0) + delta);
  }
  return next;
}

function endingCheck(state) {
  if (state.approval <= 8) return "Your government collapses under a vote of no confidence and mass protest. Approval hit rock bottom.";
  if (state.reserves <= 2.5) return "Foreign reserves are exhausted. The naira collapses and the IMF takes emergency control of fiscal policy.";
  if (state.security <= 8) return "Security has broken down nationally. A state of emergency is declared and the military assumes temporary control.";
  if (state.treasury <= -600) return "The treasury is insolvent. Nigeria defaults on domestic obligations, triggering a constitutional crisis.";
  return null;
}

function quarterLabel(turn) {
  const quarters = ["Q1", "Q2", "Q3", "Q4"];
  return { year: 2027 + Math.floor((turn - 1) / 4), quarter: quarters[(turn - 1) % 4] };
}

function pickFallback(usedTitles) {
  const pool = FALLBACK_EVENTS.filter(e => !usedTitles.includes(e.title));
  const source = pool.length ? pool : FALLBACK_EVENTS;
  return source[Math.floor(Math.random() * source.length)];
}

// ---------- OpenRouter helper ----------
// This is the one function that talks to the AI. Everything else in the game
// just builds a prompt and hands it to this.

async function callOpenRouter(prompt, maxTokens) {
  if (!OPENROUTER_API_KEY || OPENROUTER_API_KEY === "PUT-YOUR-OPENROUTER-KEY-HERE") {
    throw new Error("No OpenRouter API key set");
  }
  const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
      // Optional but recommended by OpenRouter for attribution/rankings:
      "HTTP-Referer": window.location.href,
      "X-Title": "Nigeria Command",
    },
    body: JSON.stringify({
      model: OPENROUTER_MODEL,
      max_tokens: maxTokens,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`OpenRouter error ${response.status}: ${errText}`);
  }
  const data = await response.json();
  const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!text) throw new Error("No text in OpenRouter response");
  return text.replace(/```json|```/g, "").trim();
}

// ---------- AI event generation ----------

async function generateEvent(state, history) {
  const stateSnapshot = Object.fromEntries(EFFECT_KEYS.map(k => [k, state[k]]).filter(([, v]) => v !== undefined));
  const prompt = `You are the simulation engine for a hyper-realistic Nigerian presidential political simulation game set in 2027-2030.
Generate the NEXT single crisis/event turn, grounded in real Nigerian political, economic, and security dynamics (fuel subsidy, the naira, oil and OPEC, ASUU, banditry, Boko Haram/insurgency, the Niger Delta, IMF/World Bank, US/China/EU trade relations, tariffs, state governors, elections, corruption, power grid, floods, diaspora, tech sector, etc). Where plausible, make this event a direct or indirect consequence of something in the recent history below, for narrative continuity. Do not repeat a scenario already used.

Current state (turn ${state.turn} of 16): ${JSON.stringify(stateSnapshot)}
Recent history, most recent first: ${JSON.stringify(history.slice(0, 8))}

Respond with ONLY a raw JSON object (no markdown fences, no preamble, no commentary) exactly matching this schema:
{
  "tag": "ECONOMY" | "SECURITY" | "POLITICS" | "SOCIETY" | "TRADE WAR",
  "title": "short punchy headline, max 8 words",
  "brief": "2-4 sentence presidential briefing memo describing the situation",
  "options": [
    { "label": "short action, max 8 words", "blurb": "one punchy consequence-flavored sentence", "effects": { "<one to four keys from: treasury, reserves, nairaRate, gdpGrowth, inflation, unemployment, approval, security, debt, corruption>": <number delta> } }
  ]
}
Include 2 or 3 options. Keep effect magnitudes realistic: treasury within -400..400, reserves within -8..8, nairaRate within -50..250 (positive = naira weakens), gdpGrowth within -1..1, inflation within -2..5, unemployment within -2..2, approval within -15..15, security within -10..10, debt within -8..8, corruption within -10..10. Every option should involve a real tradeoff — no option should be strictly better than another.`;

  const clean = await callOpenRouter(prompt, 1000);
  const parsed = JSON.parse(clean);
  if (!parsed.title || !Array.isArray(parsed.options) || parsed.options.length < 2) throw new Error("Malformed event");
  return parsed;
}

// ---------- AI custom-directive judge ----------

async function evaluateCustomAction(directive, state, history, currentEvent) {
  const stateSnapshot = Object.fromEntries(EFFECT_KEYS.map(k => [k, state[k]]).filter(([, v]) => v !== undefined));
  const prompt = `You are the simulation engine for a hyper-realistic Nigerian presidential political simulation game.

The president is facing this crisis:
Title: ${currentEvent.title}
Briefing: ${currentEvent.brief}

Instead of picking one of the pre-written options, the president has issued their own directive, typed verbatim:
"${directive}"

Current state (turn ${state.turn} of 16): ${JSON.stringify(stateSnapshot)}
Recent history, most recent first: ${JSON.stringify(history.slice(0, 8))}

Judge this directive as a real head-of-state would be judged: does it make sense as a response to the crisis, is it constitutionally/practically possible, is it coherent? If it's vague, apply the most literal reasonable reading. If it's nonsensical, a joke, physically impossible, or wildly outside what a president can actually do, do NOT refuse — instead resolve it as a real embarrassing or failed attempt at governing would play out, with effects that reflect that failure (usually a approval/credibility hit, sometimes worse). Never break the fourth wall or mention that you are an AI judging this; always stay in-world.

Respond with ONLY a raw JSON object (no markdown fences, no preamble, no commentary):
{
  "label": "short restatement of the directive as an action, max 8 words",
  "blurb": "one punchy consequence-flavored sentence describing what actually happens",
  "effects": { "<one to four keys from: treasury, reserves, nairaRate, gdpGrowth, inflation, unemployment, approval, security, debt, corruption>": <number delta> }
}
Keep effect magnitudes realistic: treasury within -400..400, reserves within -8..8, nairaRate within -50..250 (positive = naira weakens), gdpGrowth within -1..1, inflation within -2..5, unemployment within -2..2, approval within -15..15, security within -10..10, debt within -8..8, corruption within -10..10.`;

  const clean = await callOpenRouter(prompt, 500);
  const parsed = JSON.parse(clean);
  if (!parsed.label || !parsed.blurb) throw new Error("Malformed custom action response");
  return parsed;
}

// ---------- AI end-of-term report ----------

async function generateFinalReport(finalState, fullHistory) {
  const startSnapshot = Object.fromEntries(EFFECT_KEYS.map(k => [k, START[k]]).filter(([, v]) => v !== undefined));
  const endSnapshot = Object.fromEntries(EFFECT_KEYS.map(k => [k, finalState[k]]).filter(([, v]) => v !== undefined));
  const prompt = `You are a nonpartisan national archivist writing the official end-of-term retrospective on a Nigerian president's first term (2027-2030), for a political simulation game. Be frank and specific, not generic.

Starting state (inauguration, Q1 2027): ${JSON.stringify(startSnapshot)}
Final state (${finalState.turn > 16 ? "end of term" : "government fell"}, ${finalState.quarter} ${finalState.year}): ${JSON.stringify(endSnapshot)}
Outcome: ${finalState.endReason}

Full chronological decision record, in order:
${JSON.stringify(fullHistory)}

Write a retrospective report of 5-7 short paragraphs, plain prose, no markdown headers or bullet points, covering:
1. An overall verdict on the presidency in one or two sentences.
2. What went well — cite 2-3 specific decisions from the record by name and explain why they paid off.
3. What went badly — cite 2-3 specific decisions from the record by name and explain the damage.
4. A tour through how the country actually changed: treasury, FX reserves, the naira exchange rate, GDP growth, inflation, unemployment, approval, security, debt, and corruption — compare start to finish and say what that movement means for ordinary Nigerians, not just the numbers.
5. A closing paragraph on the president's legacy and how history is likely to remember this term.

Respond with ONLY the report text. No JSON, no markdown fences, no preamble like "Here is the report."`;

  return await callOpenRouter(prompt, 1400);
}

// ---------- Ambient score ----------
const CHORDS = [
  ["C3", "Eb3", "G3", "Bb3"],
  ["Ab2", "C3", "Eb3", "G3"],
  ["Bb2", "D3", "F3", "Ab3"],
  ["F2", "Ab2", "C3", "Eb3"],
];
const ARP_SCALE = ["C4", "Eb4", "F4", "G4", "Bb4", "C5"];

function useScore() {
  const padRef = useRef(null);
  const arpRef = useRef(null);
  const reverbRef = useRef(null);
  const chordLoopRef = useRef(null);
  const arpLoopRef = useRef(null);
  const readyRef = useRef(false);
  const chordIdxRef = useRef(0);
  const [musicOn, setMusicOn] = useState(false);

  async function ensureAudio() {
    if (readyRef.current) return;
    await Tone.start();
    const reverb = new Tone.Reverb({ decay: 6, wet: 0.45 }).toDestination();
    const pad = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "sine" },
      envelope: { attack: 2.2, decay: 1, sustain: 0.8, release: 4 },
      volume: -18,
    }).connect(reverb);
    const arp = new Tone.Synth({
      oscillator: { type: "triangle" },
      envelope: { attack: 0.02, decay: 0.6, sustain: 0, release: 1.2 },
      volume: -24,
    }).connect(reverb);

    Tone.Transport.bpm.value = 62;
    const chordLoop = new Tone.Loop(time => {
      const chord = CHORDS[chordIdxRef.current % CHORDS.length];
      pad.triggerAttackRelease(chord, "2m", time);
      chordIdxRef.current += 1;
    }, "2m");
    const arpLoop = new Tone.Loop(time => {
      if (Math.random() > 0.55) {
        const note = ARP_SCALE[Math.floor(Math.random() * ARP_SCALE.length)];
        arp.triggerAttackRelease(note, "8n", time);
      }
    }, "1m");

    padRef.current = pad;
    arpRef.current = arp;
    reverbRef.current = reverb;
    chordLoopRef.current = chordLoop;
    arpLoopRef.current = arpLoop;
    readyRef.current = true;
  }

  async function toggleMusic() {
    await ensureAudio();
    if (musicOn) {
      chordLoopRef.current.stop();
      arpLoopRef.current.stop();
      Tone.Transport.pause();
      setMusicOn(false);
    } else {
      chordLoopRef.current.start(0);
      arpLoopRef.current.start(0);
      Tone.Transport.start();
      setMusicOn(true);
    }
  }

  async function stinger(type) {
    await ensureAudio();
    const s = new Tone.Synth({ oscillator: { type: "sawtooth" }, envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.4 }, volume: -20 }).connect(reverbRef.current);
    const now = Tone.now();
    if (type === "oath") {
      s.triggerAttackRelease("C4", "16n", now);
      s.triggerAttackRelease("Eb4", "16n", now + 0.12);
      s.triggerAttackRelease("G4", "8n", now + 0.24);
    } else if (type === "click") {
      s.triggerAttackRelease("G4", "32n", now);
    } else if (type === "victory") {
      s.triggerAttackRelease(["C4", "Eb4", "G4"], "1n", now);
    } else if (type === "collapse") {
      s.triggerAttackRelease(["C4", "Gb3"], "1n", now);
    }
    setTimeout(() => s.dispose(), 3000);
  }

  return { musicOn, toggleMusic, stinger };
}

// ---------- Component ----------

function NigeriaCommand() {
  const [state, setState] = useState(START);
  const [current, setCurrent] = useState(null);
  const [loading, setLoading] = useState(false);
  const [started, setStarted] = useState(false);
  const [usingFallback, setUsingFallback] = useState(false);

  const [customText, setCustomText] = useState("");
  const [customLoading, setCustomLoading] = useState(false);
  const [customError, setCustomError] = useState("");

  const [report, setReport] = useState("");
  const [reportLoading, setReportLoading] = useState(false);
  const [reportError, setReportError] = useState(false);

  const historyRef = useRef([]);
  const fullHistoryRef = useRef([]);
  const { musicOn, toggleMusic, stinger } = useScore();

  async function loadNextEvent(nextState) {
    setLoading(true);
    setCustomText("");
    setCustomError("");
    try {
      const ev = await generateEvent(nextState, historyRef.current.map(h => `${h.title} → chose "${h.choice}"`));
      setUsingFallback(false);
      setCurrent(ev);
    } catch (e) {
      console.error(e);
      setUsingFallback(true);
      setCurrent(pickFallback(historyRef.current.map(h => h.title)));
    } finally {
      setLoading(false);
    }
  }

  async function startGame() {
    setState(START);
    historyRef.current = [];
    fullHistoryRef.current = [];
    setReport("");
    setReportError(false);
    setCustomText("");
    setCustomError("");
    setStarted(true);
    stinger("oath");
    await loadNextEvent(START);
  }

  async function loadReport(finalState) {
    setReportLoading(true);
    setReportError(false);
    try {
      const text = await generateFinalReport(finalState, fullHistoryRef.current);
      setReport(text);
    } catch (e) {
      console.error(e);
      setReportError(true);
    } finally {
      setReportLoading(false);
    }
  }

  async function choose(option) {
    stinger("click");
    let next = applyEffects(state, option.effects);
    next.inflation = Math.max(0, next.inflation + (Math.random() * 1.4 - 0.6));
    next.unemployment = Math.max(5, Math.min(60, next.unemployment + (Math.random() * 0.8 - 0.4)));
    next.approval = Math.max(0, Math.min(100, next.approval - 0.6));
    next.debt = Math.max(30, next.debt + (Math.random() * 1 - 0.3));

    const logEntry = `${state.quarter} ${state.year} — ${current.title}: chose "${option.label}"`;
    historyRef.current = [{ title: current.title, choice: option.label }, ...historyRef.current].slice(0, 12);
    fullHistoryRef.current = [...fullHistoryRef.current, {
      quarter: state.quarter, year: state.year, tag: current.tag,
      crisis: current.title, decision: option.label, result: option.blurb,
    }];
    next.log = [logEntry, ...next.log].slice(0, 40);

    const { year, quarter } = quarterLabel(next.turn + 1);
    next.turn += 1;
    next.year = year;
    next.quarter = quarter;

    const ending = endingCheck(next);
    if (ending) {
      next.ended = true;
      next.endReason = ending;
      setState(next);
      stinger("collapse");
      loadReport(next);
      return;
    }
    if (next.turn > 16) {
      const won = next.approval >= 45;
      next.ended = true;
      next.endReason = won
        ? "Your first term ends. With approval holding, you are re-elected to a second term."
        : "Your first term ends. With approval too low, voters hand the presidency to the opposition.";
      setState(next);
      stinger(won ? "victory" : "collapse");
      loadReport(next);
      return;
    }

    setState(next);
    await loadNextEvent(next);
  }

  async function submitCustomDirective() {
    const directive = customText.trim();
    if (!directive || customLoading || loading) return;
    setCustomLoading(true);
    setCustomError("");
    try {
      const opt = await evaluateCustomAction(directive, state, historyRef.current, current);
      setCustomText("");
      await choose(opt);
    } catch (e) {
      console.error(e);
      setCustomError("Couldn't process that directive — try rephrasing it as a concrete action.");
    } finally {
      setCustomLoading(false);
    }
  }

  const termProgress = Math.min(100, Math.round(((state.turn - 1) / 16) * 100));

  return (
    <div style={styles.page}>
      <style>{`
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
        @keyframes spin { to { transform: rotate(360deg); } }
        .memo { animation: fadeIn 0.35s ease-out; }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
        .stat-btn:focus-visible, .opt-btn:focus-visible, .start-btn:focus-visible, .custom-submit:focus-visible, .custom-input:focus-visible { outline: 2px solid #C89B3C; outline-offset: 2px; }
        .custom-input::placeholder { color: #9a9488; }
        @media (prefers-reduced-motion: reduce) { .memo { animation: none; } .spin { animation: none; } }
      `}</style>

      <div style={styles.header}>
        <div style={styles.headerTop}>
          <div style={styles.seal}>NG</div>
          <div style={{ flex: 1 }}>
            <div style={styles.kicker}>OFFICE OF THE PRESIDENT · FEDERAL REPUBLIC OF NIGERIA</div>
            <div style={styles.h1}>Nigeria Command</div>
          </div>
          <button
            onClick={toggleMusic}
            aria-label={musicOn ? "Mute music" : "Play music"}
            className="stat-btn"
            style={styles.musicBtn}
          >
            <span style={{ fontSize: 16 }}>{musicOn ? "🔊" : "🔇"}</span>
          </button>
        </div>
        {started && !state.ended && (
          <div style={styles.termBar}>
            <div style={styles.termBarLabel}>Term Progress — {state.quarter} {state.year} {usingFallback ? "· offline mode" : "· live briefing engine"}</div>
            <div style={styles.termTrack}><div style={{ ...styles.termFill, width: `${termProgress}%` }} /></div>
          </div>
        )}
      </div>

      {!started ? (
        <div style={styles.briefingCard} className="memo">
          <div style={styles.briefingEyebrow}>CLASSIFIED · INAUGURATION BRIEFING</div>
          <p style={styles.briefingText}>
            You have just been sworn in as President of Nigeria, 2027. Oil revenue is volatile, the naira is under pressure,
            inflation is squeezing households, and a trade realignment abroad is reshaping your export markets. Sixteen quarters —
            one full term — stand between you and re-election.
          </p>
          <p style={styles.briefingText2}>
            Every briefing you receive is drafted live and shaped by your own decisions — no two presidencies unfold the same way.
            You can also bypass the prepared options entirely and issue your own directive; the engine will judge whether it holds up.
          </p>
          <button style={styles.startBtn} className="start-btn" onClick={startGame}>Take the Oath of Office</button>
        </div>
      ) : (
        <>
          <div style={styles.statGrid}>
            {STAT_META.map(m => (
              <div key={m.key} style={styles.statCard}>
                <span style={{ fontSize: 15 }}>{ICONS[m.key]}</span>
                <div style={styles.statLabel}>{m.label}</div>
                <div style={styles.statValue}>{m.fmt(state[m.key])}</div>
              </div>
            ))}
          </div>

          {!state.ended ? (
            loading || !current ? (
              <div style={styles.loadingCard}>
                <span className="spin" style={{ fontSize: 20, color: "#C89B3C" }}>⟳</span>
                <div style={styles.loadingText}>Drafting presidential briefing…</div>
              </div>
            ) : (
              <div style={styles.memoCard} className="memo" key={current.title + state.turn}>
                <div style={styles.memoHeader}>
                  <span style={styles.tag}>{current.tag}</span>
                  <span style={styles.memoDate}>{state.quarter} {state.year}</span>
                </div>
                <div style={styles.memoTitle}>{current.title}</div>
                <p style={styles.memoBrief}>{current.brief}</p>
                <div style={styles.optWrap}>
                  {current.options.map((opt, i) => (
                    <button key={i} className="opt-btn" style={styles.optBtn} onClick={() => choose(opt)} disabled={customLoading}>
                      <div style={styles.optLabel}>{opt.label}</div>
                      <div style={styles.optBlurb}>{opt.blurb}</div>
                    </button>
                  ))}

                  <div style={styles.customBox}>
                    <div style={styles.customLabel}>OR ISSUE YOUR OWN DIRECTIVE</div>
                    <div style={styles.customRow}>
                      <input
                        className="custom-input"
                        style={styles.customInput}
                        type="text"
                        placeholder="e.g. Call an emergency cabinet session and freeze all state travel budgets"
                        value={customText}
                        disabled={customLoading}
                        onChange={e => setCustomText(e.target.value)}
                        onKeyDown={e => { if (e.key === "Enter") submitCustomDirective(); }}
                      />
                      <button
                        className="custom-submit"
                        style={{ ...styles.customSubmit, opacity: customLoading || !customText.trim() ? 0.55 : 1 }}
                        onClick={submitCustomDirective}
                        disabled={customLoading || !customText.trim()}
                        aria-label="Submit directive"
                      >
                        {customLoading ? <span className="spin">⟳</span> : "➤"}
                      </button>
                    </div>
                    {customError && <div style={styles.customError}>{customError}</div>}
                  </div>
                </div>
              </div>
            )
          ) : (
            <>
              <div style={styles.memoCard} className="memo">
                <div style={styles.memoHeader}><span style={{ ...styles.tag, background: "#A13D2B" }}>END OF TERM</span></div>
                <div style={styles.memoTitle}>{state.turn > 16 ? "Term Complete" : "Government Falls"}</div>
                <p style={styles.memoBrief}>{state.endReason}</p>
                <div style={styles.finalStatsRow}>
                  <span>Final Approval: {Math.round(state.approval)}%</span>
                  <span>Final Reserves: ${state.reserves.toFixed(1)}B</span>
                  <span>Final Security: {Math.round(state.security)}</span>
                </div>
                <button style={styles.startBtn} className="start-btn" onClick={startGame}>Start a New Term</button>
              </div>

              <div style={styles.reportCard} className="memo">
                <div style={styles.reportHeader}>
                  <span style={{ fontSize: 15 }}>📄</span>
                  <span style={styles.reportEyebrow}>NATIONAL ARCHIVES · OFFICIAL RETROSPECTIVE</span>
                </div>
                {reportLoading ? (
                  <div style={styles.reportLoading}>
                    <span className="spin" style={{ fontSize: 18, color: "#C89B3C" }}>⟳</span>
                    <span style={styles.loadingText}>Compiling the historical record…</span>
                  </div>
                ) : reportError ? (
                  <p style={styles.reportBody}>The archives could not compile a full retrospective right now. Based on the record alone: the term ended with approval at {Math.round(state.approval)}%, reserves at ${state.reserves.toFixed(1)}B, security at {Math.round(state.security)}, and inflation at {state.inflation.toFixed(1)}%.</p>
                ) : (
                  report.split("\n").filter(p => p.trim()).map((para, i) => (
                    <p key={i} style={styles.reportBody}>{para}</p>
                  ))
                )}
              </div>
            </>
          )}

          {state.log.length > 0 && (
            <div style={styles.logCard}>
              <div style={styles.logTitle}>Presidential Log</div>
              {state.log.slice(0, 8).map((l, i) => (<div key={i} style={styles.logLine}>{l}</div>))}
            </div>
          )}
        </>
      )}
    </div>
  );
}
